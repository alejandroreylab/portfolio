<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba de Motion</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .box {
      padding: 2rem 3rem;
      background: #6c5ce7;
      color: #fff;
      border-radius: 12px;
      font-size: 1.25rem;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="box" id="box">¡Motion funciona! 🎉</div>

  <script src="./node_modules/motion/dist/motion.js"></script>
  <script>
    Motion.animate(
      "#box",
      { opacity: [0, 1], y: [20, 0] },
      { duration: 0.5, ease: "easeOut" }
    );
  </script>
</body>
</html>
